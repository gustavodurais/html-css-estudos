<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 - Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Grid</h1>
  <p>Grid organiza itens em <strong>duas dimensões</strong>: linhas e colunas.</p>

  <h2>Layout de página com áreas nomeadas</h2>
  <div class="pagina">
    <header class="topo">Topo</header>
    <nav class="lateral" aria-label="Exemplo">Menu lateral</nav>
    <main class="principal">Conteúdo principal</main>
    <footer class="rodape">Rodapé</footer>
  </div>

  <h2>Galeria que se ajusta sozinha</h2>
  <div class="galeria">
    <div class="foto">1</div>
    <div class="foto">2</div>
    <div class="foto">3</div>
    <div class="foto">4</div>
    <div class="foto">5</div>
    <div class="foto">6</div>
  </div>

  <p><a href="../index.html">Voltar ao índice</a></p>
</body>
</html>
