<!DOCTYPE html>
<!-- Declara que o documento é HTML5. Sempre a primeira linha. -->
<html lang="pt-BR">
<!-- lang informa o idioma da página (leitores de tela e buscadores usam). -->
<head>
  <!-- O head guarda informações sobre a página; nada aqui aparece nela. -->
  <meta charset="UTF-8">
  <!-- UTF-8 faz os acentos (ç, ã, é) aparecerem corretamente. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Faz a página se ajustar à largura do celular. -->
  <title>01 - Estrutura básica</title>
  <!-- O título aparece na aba do navegador. -->
</head>
<body>
  <!-- Tudo o que aparece na página fica dentro do body. -->
  <h1>Olá, mundo!</h1>
  <p>Esta é a estrutura mínima de uma página HTML.</p>
  <p><a href="../index.html">Voltar ao índice</a></p>
</body>
</html>
