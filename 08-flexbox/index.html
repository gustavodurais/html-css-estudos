<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 - Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Flexbox</h1>
  <p>Flexbox organiza itens em <strong>uma dimensão</strong>: linha ou coluna.</p>

  <h2>Barra de navegação</h2>
  <nav class="barra" aria-label="Exemplo">
    <a class="logo" href="#">Estudos</a>
    <ul class="menu">
      <li><a href="#">Início</a></li>
      <li><a href="#">Projetos</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
  </nav>

  <h2>Itens que quebram de linha</h2>
  <div class="trilha">
    <div class="item">Python</div>
    <div class="item">HTML</div>
    <div class="item">CSS</div>
    <div class="item">Git</div>
    <div class="item">SQL</div>
    <div class="item">APIs</div>
  </div>

  <h2>Centralizando algo</h2>
  <div class="centro">Centralizado na horizontal e na vertical</div>

  <p><a href="../index.html">Voltar ao índice</a></p>
</body>
</html>
