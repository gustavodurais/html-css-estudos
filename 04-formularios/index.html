<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 - Formulários</title>
</head>

<body>
  <h1>Formulário de inscrição</h1>

  <!--
    action="#" significa que o formulário não é enviado a lugar nenhum.
    Para receber os dados é preciso um servidor (por exemplo, um backend em
    Python).
  -->
  <form action="#" method="post">
    <fieldset>
      <legend>Dados pessoais</legend>

      <!-- label ligado ao campo por for/id: clicar no texto foca o campo. -->
      <p>
        <label for="nome">Nome completo</label><br>
        <input type="text" id="nome" name="nome" required autocomplete="name">
      </p>
      <p>
        <label for="email">E-mail</label><br>
        <input type="email" id="email" name="email" required autocomplete="email">
      </p>
      <p>
        <label for="senha">Senha (mínimo 8 caracteres)</label><br>
        <input type="password" id="senha" name="senha" minlength="8" required autocomplete="new-password">
      </p>
      <p>
        <label for="idade">Idade</label><br>
        <input type="number" id="idade" name="idade" min="0" max="120">
      </p>
      <p>
        <label for="nascimento">Data de nascimento</label><br>
        <input type="date" id="nascimento" name="nascimento">
      </p>
    </fieldset>

    <fieldset>
      <legend>Seu nível em programação</legend>
      <!-- Radios com o mesmo name: só um pode ser marcado. -->
      <p>
        <input type="radio" id="iniciante" name="nivel" value="iniciante" checked>
        <label for="iniciante">Iniciante</label>
      </p>
      <p>
        <input type="radio" id="intermediario" name="nivel" value="intermediario">
        <label for="intermediario">Intermediário</label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Interesses</legend>
      <!-- Checkboxes: vários podem ser marcados. -->
      <p>
        <input type="checkbox" id="automacao" name="interesses" value="automacao">
        <label for="automacao">Automação</label>
      </p>
      <p>
        <input type="checkbox" id="dados" name="interesses" value="dados">
        <label for="dados">Dados</label>
      </p>
      <p>
        <input type="checkbox" id="backend" name="interesses" value="backend">
        <label for="backend">Backend</label>
      </p>
    </fieldset>

    <p>
      <label for="area">Área de atuação</label><br>
      <select id="area" name="area">
        <option value="">Selecione</option>
        <option value="ti">Tecnologia</option>
        <option value="adm">Administrativo</option>
        <option value="outra">Outra</option>
      </select>
    </p>
    <p>
      <label for="mensagem">Mensagem</label><br>
      <textarea id="mensagem" name="mensagem" rows="4" cols="40"></textarea>
    </p>

    <button type="submit">Enviar inscrição</button>
    <button type="reset">Limpar campos</button>
  </form>

  <p><a href="../index.html">Voltar ao índice</a></p>
</body>

</html>
